<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Oggetti conosciuti
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  @for (entry of timeline; track entry) {
    @if (entry.tipo === 'scan') {
      <ion-card>
        <ion-card-header>
          <ion-card-title>{{entry.scan.nome}}</ion-card-title>
          <ion-card-subtitle>{{entry.scan.datascan}}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          {{entry.scan.descrizione}}
        </ion-card-content>
      </ion-card>
    }
    @if (entry.tipo === 'messaggio') {
      <ion-card>
        <ion-card-header>
          <ion-card-title><span class="gold">Messaggio</span></ion-card-title>
          <ion-card-subtitle>{{entry.messaggio.data}}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          {{entry.messaggio.testo}}
        </ion-card-content>
        @if (entry.messaggio.url) {
          <ion-button fill="clear" (click)="openMessaggio(entry.messaggio.url)">Apri</ion-button>
        }
      </ion-card>
    }
  }

</ion-content>
