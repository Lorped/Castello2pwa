<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Oggetti conosciuti
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ng-container *ngFor="let entry of timeline">

    <ion-card *ngIf="entry.tipo === 'scan'">
      <ion-card-header>
        <ion-card-title>{{entry.scan.nome}}</ion-card-title>
        <ion-card-subtitle>{{entry.scan.datascan}}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        {{entry.scan.descrizione}}
      </ion-card-content>
    </ion-card>

    <ion-card *ngIf="entry.tipo === 'messaggio'">
      <ion-card-header>
        <ion-card-title><span class="gold">Messaggio</span></ion-card-title>
        <ion-card-subtitle>{{entry.messaggio.data}}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        {{entry.messaggio.testo}}
      </ion-card-content>
      <ion-button fill="clear" *ngIf="entry.messaggio.url" (click)="openMessaggio(entry.messaggio.url)">Apri</ion-button>
    </ion-card>

  </ng-container>

</ion-content>
